services:
  # ── Pipeline profile (execução one-shot dos estágios) ────────────────
  pipeline:
    image: credit-monitor
    profiles:
      - train
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../reports:/app/reports
      - ../configs:/app/configs
    command: ["sh", "-c", "python -m src.data.ingest && python -m src.contracts.validate && python -m src.model.train && python -m src.drift.run && python -m src.observability.run"]

  # ── MLflow tracking server ───────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    profiles:
      - mlflow
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    volumes:
      - ../mlruns:/mlruns
    command:
      - sh
      - -c
      - "pip install --quiet boto3 && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlruns/mlflow.db --default-artifact-root /mlruns/artifacts"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Dashboard profile (Streamlit) ────────────────────────────────────
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: credit-monitor
    profiles:
      - dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data:ro
      - ../models:/app/models:ro
      - ../reports:/app/reports:ro
      - ../logs:/app/logs:ro
      - ../dashboard:/app/dashboard:ro

  # ── Monitoring profile (Prometheus + Grafana + exporter, opcional) ────
  exporter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: credit-monitor
    profiles:
      - monitoring
    ports:
      - "${PROMETHEUS_EXPORTER_PORT:-8000}:8000"
    env_file:
      - ../.env
    volumes:
      - ../reports:/app/reports:ro
      - ../logs:/app/logs:ro
      - ../configs:/app/configs:ro
    command: ["python", "-m", "src.observability.exporter"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    profiles:
      - monitoring
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      exporter:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5

  grafana:
    image: grafana/grafana-oss:latest
    profiles:
      - monitoring
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
