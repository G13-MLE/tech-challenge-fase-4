# =============================================================================
# Pipeline DVC: ingestao -> validacao -> treino -> drift -> monitoramento
# =============================================================================

stages:
  ingestao:
    cmd: uv run python -m src.data.ingest
    deps:
      - data/raw/reference.csv
      - src/data/ingest.py
      - src/data/dedup.py
      - src/data/split.py
      - src/core/dataset.py
      - src/core/params.py
      - configs/params.yaml
    outs:
      - data/reference/reference.parquet
    metrics:
      - reports/validation/dedup.json:
          cache: false
      - reports/validation/harmonization.json:
          cache: false

  validacao:
    cmd: uv run python -m src.contracts.validate && uv run python -m src.contracts.profile
    deps:
      - data/reference/reference.parquet
      - reports/validation/dedup.json
      - reports/validation/harmonization.json
      - src/contracts/schema.py
      - src/contracts/validate.py
      - src/contracts/quality.py
      - src/contracts/profile.py
      - src/data/missingness.py
      - src/data/outliers.py
      - src/core/dataset.py
      - configs/params.yaml
    outs:
      - reports/validation/profile.html:
          cache: false
    metrics:
      - reports/validation/result.json:
          cache: false

  treino:
    cmd: uv run python -m src.model.train
    deps:
      - data/reference/reference.parquet
      - src/model/train.py
      - src/model/evaluate.py
      - src/core/dataset.py
      - src/core/params.py
      - configs/params.yaml
    outs:
      - models/model.joblib
    metrics:
      - reports/train_metrics.json:
          cache: false

  drift:
    cmd: uv run python -m src.drift.run
    deps:
      - data/reference/reference.parquet
      - models/model.joblib
      - reports/train_metrics.json
      - src/drift/run.py
      - src/drift/simulate.py
      - src/drift/stats.py
      - src/drift/multivariate.py
      - src/drift/detect.py
      - src/drift/concept.py
      - src/drift/report.py
      - src/model/predict.py
      - src/model/evaluate.py
      - src/core/dataset.py
      - src/core/params.py
      - configs/params.yaml
    outs:
      - data/production
      - reports/drift/drift_report.html:
          cache: false
      - reports/drift/statistical_summary.md:
          cache: false
    metrics:
      - reports/drift/statistical_report.json:
          cache: false
      - reports/drift/performance.json:
          cache: false
      - reports/drift/drift_test_result.json:
          cache: false

  monitoramento:
    cmd: uv run python -m src.observability.run
    deps:
      - data/reference/reference.parquet
      - data/production
      - models/model.joblib
      - reports/drift/statistical_report.json
      - reports/drift/performance.json
      - reports/train_metrics.json
      - reports/validation/result.json
      - src/observability
      - src/model/predict.py
      - src/core/dataset.py
      - configs/params.yaml
    outs:
      - reports/monitoring/run_summary.json:
          cache: false
      - reports/fairness
    metrics:
      - reports/monitoring/slo_report.json:
          cache: false
      - reports/monitoring/retrain_decision.json:
          cache: false
