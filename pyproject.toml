[project]
name = "techchallenge-fase-4"
version = "0.1.0"
description = "Observabilidade contínua, detecção de drift, qualidade de dados e governança para credit scoring"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasketch>=1.6.0",
    "evidently>=0.7.23,<0.8",
    "jinja2>=3.1.0",
    "joblib>=1.4.0",
    "kagglehub>=0.3.0",
    "mlflow>=2.14.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pandera>=0.20.0",
    "prometheus-client>=0.21.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "streamlit>=1.36.0",
    "xgboost>=2.0.0",
    "xlrd>=2.0.0",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "dvc>=3.67.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.0",
    "ruff>=0.15.17",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "SIM",
    "C4",
    "T20",
    "RET",
    "PTH",
]
ignore = ["B008", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]
filterwarnings = [
    "ignore::DeprecationWarning:joblib",
]

[tool.setuptools.packages.find]
where = ["src"]
