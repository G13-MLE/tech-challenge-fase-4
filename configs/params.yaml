# =============================================================================
# Parâmetros do pipeline — credit scoring / drift
# =============================================================================

data:
  # Coluna alvo binária (0 = adimplente, 1 = inadimplente)
  target_column: default_next_month
  # Coluna de identificação (PII — dropada ou pseudonimizada na ingestão)
  id_column: ID
  # Proporção do dataset de referência usada para treino
  reference_train_size: 0.8
  seed: 42

dataset:
  # Fonte do dataset de referência: uci (real ~30k) | synthetic (fallback offline/CI)
  source: uci

quality:
  # Limiar de similaridade Jaccard (MinHash/LSH) para near-duplicates
  near_dup_threshold: 0.9
  # Decisão por coluna (opt-in): keep | remove | transform.
  # Vazio ⇒ política flag-and-keep (nenhuma mutação silenciosa).
  decisions: {}

train:
  seed: 42
  # Classificador principal ("xgboost" ou "logistic_regression")
  classifier: xgboost
  # Peso das classes ("balanced" ou null) — lida com desbalanceamento de crédito
  class_weight: balanced
  # Hiperparâmetros da regressão logística (baseline interpretável)
  logistic_regression_C: 0.5
  logistic_regression_max_iter: 2000
  # Hiperparâmetros do XGBoost
  xgboost_n_estimators: 300
  xgboost_max_depth: 4
  xgboost_learning_rate: 0.05
  xgboost_subsample: 0.8
  xgboost_colsample_bytree: 0.8

drift:
  seed: 42
  # Número de snapshots mensais de produção simulados
  n_snapshots: 6
  # Intensidade global do drift (0 = sem drift, 1 = forte)
  intensity: 0.5
  # Features deslocadas e direção do deslocamento econômico
  shifted_features:
    LIMIT_BAL: increase
    AGE: increase
    PAY_0: increase
  # Drift de conceito: fração de mudança em P(y|X). Calibrado para produzir
  # uma queda monotônica de ROC-AUC ao longo dos 6 snapshots (dados UCI 350).
  concept_drift_strength: 1.5

drift_thresholds:
  # PSI é a métrica de decisão primária (effect size)
  psi_stable: 0.1
  psi_moderate: 0.25
  # Queda de ROC-AUC que dispara alerta de degradação
  auc_drop_alert: 0.05
  # Multivariado (MMD²/Energy): número de reamostragens bootstrap do limiar nulo
  multivariate_n_bootstrap: 200
  # Quantil do limiar nulo calibrado por bootstrap (p95)
  multivariate_bootstrap_quantile: 0.95
  # Fração de colunas com drift para o Evidently marcar o dataset como
  # "drift detectado". Alinhado ao critério por feature (qualquer feature com
  # PSI > 0.25 é breach); o default do Evidently é 0.5 (contraditório aqui).
  evidently_drift_share: 0.1

# Data SLOs e Error Budget (FR-015)
slo:
  accuracy_min: 0.85
  psi_max: 0.25
  ks_pvalue_min: 0.05
  missing_rate_max: 0.01

# Consolidação anti-fadiga de alertas (FR-016) — apenas notificação
alerts:
  # Nº de features que devem cruzar juntas para consolidar um alerta
  breach_features: 2
  # Nº de janelas consecutivas para 1 feature crítica consolidar um alerta
  consolidation_windows: 3

# Gatilho de re-treino por regra objetiva (FR-017)
retrain:
  # Nº de meses consecutivos em severidade crítica para disparar o re-treino
  consecutive_critical_windows: 2

# Guardrails de fairness por subgrupo (FR-017, FR-026)
fairness:
  # Razão de impacto dispar mínima (regra dos 80%)
  disparate_impact_min: 0.8
  # Diferença máxima de equal opportunity (TPR) em SEX e faixas de AGE
  equal_opportunity_max: 0.10

# Demo executável (US7): make demo-drift — camada de apresentação isolada.
# NÃO é um estágio DVC; não sobrescreve artefatos canônicos.
demo:
  # Rótulo de exibição (apenas identificador; não seleciona presets)
  scenario: economic_shock
  # Número de meses (snapshots) simulados no demo
  n_snapshots: 6
  # Intensidade do Data Drift do demo (amplificada para um choque visível)
  intensity: 0.8
  # Magnitude do Concept Drift P(y|X) no demo
  concept_drift_strength: 1.5
  # Diretório isolado de evidência do demo
  output_dir: reports/drift/demo
  # Seed determinística do demo
  seed: 42
